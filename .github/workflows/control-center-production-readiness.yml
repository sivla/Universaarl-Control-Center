name: Kontrollzentrum Produktionsreife
on:
  workflow_dispatch:
  push:
    branches: [main, codex/verify-spectra-snapshot-chain]
permissions:
  contents: read
jobs:
  platform:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Doctor
        shell: pwsh
        run: ./scripts/Initialize-UniversaarlControlCenter.ps1 -Json
      - name: Portabilitaet
        shell: pwsh
        run: ./tests/Test-ControlCenterPortability.ps1
      - name: Rollengrenze
        shell: pwsh
        run: ./tests/Test-ControlCenterRoleBoundary.ps1
      - name: Produktionsreifevertrag
        shell: pwsh
        run: ./tests/Test-ProductionReadinessValidator.ps1
      - name: Diff-Pruefung
        shell: pwsh
        run: git diff --check
